<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>은혜의교회 고등부</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  body { margin: 0; }
  #gy-root, #gy-root * { box-sizing: border-box; }
  #gy-root {
    --indigo: #4B3AA4;
    --indigo-deep: #2E2266;
    --dawn: #F3B65A;
    --dawn-soft: #FBE6C2;
    --rose: #E2637A;
    --rose-soft: #FBDCE2;
    --paper: #F8F6FC;
    --ink: #221C3A;
    --ink-soft: #6E6690;
    --card: #FFFFFF;
    --line: #E7E1F3;
    --shadow: 0 2px 14px rgba(43,30,90,0.08), 0 1px 2px rgba(43,30,90,0.06);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    position: relative;
  }
  #gy-root .serif { font-family: 'Gowun Batang', serif; }

  .glow {
    position: absolute; top: -120px; left: 50%; transform: translateX(-50%);
    width: 640px; height: 320px; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at center, rgba(243,182,90,0.35), rgba(75,58,164,0.18) 55%, transparent 75%);
    filter: blur(10px);
  }

  .shell { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 92px; }
  .container { max-width: 640px; margin: 0 auto; padding: 20px 18px 40px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; position: sticky; top: 0; z-index: 20;
    background: rgba(248,246,252,0.88); backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 14px;
  }
  .brand .name { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .who { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .who button {
    border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
    padding: 6px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .who button:hover { background: var(--dawn-soft); color: var(--indigo-deep); }
  @media (max-width: 400px) {
    .topbar { padding: 12px 14px; flex-wrap: wrap; row-gap: 8px; }
    .brand .name { font-size: 15px; }
    .who { font-size: 11.5px; width: 100%; justify-content: flex-start; }
    .who button { padding: 5px 9px; font-size: 11px; }
  }

  .gate { max-width: 380px; margin: 90px auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 32px 26px; box-shadow: var(--shadow); position: relative; z-index: 1; }
  .gate h2 { font-family: 'Gowun Batang', serif; margin: 0 0 6px; font-size: 21px; color: var(--indigo-deep); }
  .gate p.hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; line-height: 1.55; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 12px; font-size: 14.5px; font-family: 'Noto Sans KR', sans-serif; color: var(--ink);
  }
  .field input:focus, .field textarea:focus { outline: 2px solid var(--indigo); outline-offset: 1px; border-color: var(--indigo); }
  .field textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .radio-row { display: flex; gap: 10px; }
  .radio-opt {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; text-align: center;
    font-size: 13px; cursor: pointer; color: var(--ink-soft); user-select: none;
  }
  .radio-opt.on { background: var(--indigo); color: #fff; border-color: var(--indigo); font-weight: 700; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: 'Noto Sans KR', sans-serif; }
  .btn-primary { background: var(--indigo); color: #fff; }
  .btn-primary:hover { background: var(--indigo-deep); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--dawn-soft); color: var(--indigo-deep); }
  .btn-block { width: 100%; }
  .btn-sm { font-size: 12.5px; padding: 6px 12px; }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: center; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(248,246,252,0), var(--paper) 30%);
  }
  .tabbar-inner {
    display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 6px; box-shadow: 0 8px 24px rgba(43,30,90,0.14); max-width: 480px; width: 100%;
  }
  .tabbtn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: transparent; border: none; border-radius: 13px; padding: 8px 4px; cursor: pointer;
    color: var(--ink-soft); font-family: 'Noto Sans KR', sans-serif;
  }
  .tabbtn .ic { font-size: 18px; }
  .tabbtn .lb { font-size: 10.5px; font-weight: 500; }
  .tabbtn.active { background: var(--indigo); color: #fff; }

  .section-title { font-family: 'Gowun Batang', serif; font-size: 18px; font-weight: 700; margin: 0 0 4px; color: var(--indigo-deep); }
  .section-desc { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 16px; line-height: 1.55; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px; }

  .divider { height: 1px; background: var(--line); margin: 22px 0; }

  .cal-head { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 12px; }
  .cal-head .navbtn { background: var(--paper); border: 1px solid var(--line); color: var(--indigo-deep); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .cal-title { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 15px; min-width: 90px; text-align: center; }
  .sunday-list { display: flex; flex-direction: column; gap: 8px; }
  .sunday-row {
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fff;
  }
  .sunday-row.got { background: var(--indigo); border-color: var(--indigo); color: #fff; }
  .sunday-row.future { opacity: .5; }
  .sunday-row.clickable { cursor: pointer; }
  .sunday-date { font-size: 13.5px; font-weight: 500; }
  .sunday-mark { font-size: 12.5px; font-weight: 700; }

  .feed-card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--indigo);
    border-radius: 12px; padding: 15px 17px; margin-bottom: 12px; }
  .feed-card.qt { border-left-color: var(--dawn); }
  .feed-card.prayer { border-left-color: var(--rose); }
  .feed-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .feed-title { font-weight: 700; font-size: 14.5px; }
  .feed-date { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .feed-meta { font-size: 12px; color: var(--indigo); margin-top: 2px; font-weight: 500; }
  .feed-body { font-size: 13.5px; line-height: 1.65; margin-top: 8px; white-space: pre-wrap; color: var(--ink); }
  .feed-author { font-size: 11.5px; color: var(--ink-soft); margin-top: 6px; }

  .badge { display: inline-block; font-size: 10.5px; padding: 2px 9px; border-radius: 999px; font-weight: 700; }
  .badge-public { background: var(--dawn-soft); color: #8A6417; }
  .badge-private { background: #EEE9F9; color: var(--indigo-deep); }
  .badge-answered { background: var(--rose-soft); color: #A13851; }

  .comment { margin-top: 10px; background: var(--paper); border-radius: 8px; padding: 8px 11px; font-size: 12.5px; }
  .comment b { color: var(--indigo); }
  .comment-form { margin-top: 10px; display: flex; gap: 8px; }
  .comment-form input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .empty .big { font-size: 30px; margin-bottom: 10px; }

  .kid-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px;
    box-shadow: var(--shadow); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .kid-info { cursor: pointer; flex: 1; }
  .kid-info h4 { font-family: 'Gowun Batang', serif; font-size: 14.5px; margin: 0 0 4px; }
  .kid-info .stat { font-size: 11px; color: var(--ink-soft); }
  .kid-actions { display: flex; align-items: center; gap: 6px; }
  .present-toggle {
    border: 1px solid var(--indigo); background: #fff; color: var(--indigo); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .present-toggle.on { background: var(--indigo); color: #fff; }
  .kid-del { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 15px; padding: 4px; }
  .kid-del:hover { color: var(--rose); }

  .backlink { font-size: 12.5px; color: var(--indigo-deep); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 12px; font-weight: 500; }
  .backlink:hover { text-decoration: underline; }

  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--indigo-deep); color: #fff; padding: 10px 20px; border-radius: 999px;
    font-size: 13px; z-index: 50; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }

  .subtab-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .subtab { flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink-soft); text-align: center; font-size: 13px; font-weight: 500; cursor: pointer; }
  .subtab.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }

  .del-x { float: right; font-size: 11.5px; color: var(--ink-soft); cursor: pointer; background: none; border: none; }
  .del-x:hover { color: var(--rose); }

  .attend-summary { display: flex; gap: 10px; margin-bottom: 16px; }
  .attend-summary .box { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; box-shadow: var(--shadow); }
  .attend-summary .box b { font-family: 'Gowun Batang', serif; font-size: 22px; color: var(--indigo); display: block; }
  .attend-summary .box span { font-size: 11px; color: var(--ink-soft); }

  .class-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px;
    box-shadow: var(--shadow); margin-bottom: 12px; cursor: pointer; }
  .class-card h4 { font-family: 'Gowun Batang', serif; font-size: 16px; margin: 0 0 8px; color: var(--indigo-deep); }
  .class-card .row { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-soft); }
  .class-card .row b { color: var(--indigo); font-size: 14px; }
  .class-card .row .absent b { color: var(--rose); }

  .add-kid-row { display: grid; grid-template-columns: 84px 1fr 1fr auto; gap: 8px; margin-bottom: 16px; }
  .add-kid-row select { border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; font-size: 13.5px; background:#fff; }
  @media (max-width: 480px) { .add-kid-row { grid-template-columns: 1fr 1fr; } .add-kid-row button { grid-column: span 2; } }

  .week-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; font-size: 13px; background: #fff; }
  .week-row .wk-date { font-weight: 500; }
  .week-row .wk-counts { display: flex; gap: 10px; }
  .week-row .present { color: var(--indigo); font-weight: 700; }
  .week-row .absent { color: var(--rose); font-weight: 700; }

  .stat-box { display:flex; gap:10px; margin-bottom:18px; }
  .stat-box .sb { flex:1; background: var(--indigo); color:#fff;
    border-radius: 12px; padding: 13px; text-align:center; box-shadow: var(--shadow); }
  .stat-box .sb b { font-family:'Gowun Batang', serif; font-size: 22px; display:block; }
  .stat-box .sb span { font-size: 11px; opacity:.9; }

  .rate-row { margin-bottom: 14px; }
  .rate-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; font-weight: 500; }
  .rate-top .pct { color: var(--indigo-deep); font-weight: 700; }
  .rate-track { height: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .rate-fill { height: 100%; background: var(--indigo); border-radius: 999px; transition: width .4s; }

  .chart-bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding: 10px 4px 0; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-pct { font-size: 10px; color: var(--indigo-deep); font-weight: 700; margin-bottom: 4px; }
  .bar-fill { width: 60%; min-height: 3px; background: var(--indigo); border-radius: 4px 4px 2px 2px; }
  .bar-label { font-size: 10px; color: var(--ink-soft); margin-top: 6px; text-align:center; }

  .month-picker { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:16px; }

  .badge-absence { background: var(--rose-soft); color: #A13851; }
  .badge-visit { background: #EEE9F9; color: var(--indigo-deep); }
  .badge-etc { background: var(--dawn-soft); color: #8A6417; }

  .note-item { border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; background:#fff; }
  .note-item .ni-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px; flex-wrap: wrap; }
  .note-item .ni-body { font-size:13.5px; line-height:1.6; white-space:pre-wrap; }
  .note-item .ni-meta { font-size: 11px; color: var(--ink-soft); margin-top: 6px; }

  .grade-circles { display: flex; gap: 12px; margin-bottom: 20px; }
  .grade-circle {
    flex: 1; aspect-ratio: 1; border-radius: 50%;
    border: 2px solid var(--line); background: var(--card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow); transition: all .2s; padding: 8px;
  }
  .grade-circle:hover { border-color: var(--indigo); background: var(--indigo); }
  .grade-circle:hover .gc-label, .grade-circle:hover .gc-sub { color: #fff !important; }
  .grade-circle .gc-label { font-family: 'Gowun Batang', serif; font-size: 20px; font-weight: 700; color: var(--indigo-deep); }
  .grade-circle .gc-count { font-family: 'Gowun Batang', serif; font-size: 15px; font-weight: 700; color: var(--indigo); margin: 2px 0; }
  .grade-circle .gc-sub { font-size: 10px; color: var(--ink-soft); }

  .bulk-area { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .bulk-area textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; resize: vertical; min-height: 120px; line-height: 1.7; }
  .bulk-area textarea:focus { outline: 2px solid var(--indigo); }
  .bulk-preview { margin-top: 10px; max-height: 200px; overflow-y: auto; font-size: 12.5px; }
  .bulk-preview .bp-ok { color: var(--indigo-deep); padding: 2px 0; }
  .bulk-preview .bp-err { color: var(--rose); padding: 2px 0; }
  </style>

<!-- 앱 본체 -->
<script>
(function(){
  const shell = document.getElementById('gy-shell');
  const TEACHER_PASSCODE = '0000';

  const state = {
    authed: false,
    teacherName: null,
    tab: 'attend',
    attendClass: null,
    attendKid: null,
    attendGrade: null,
    prayerView: 'all',
    _calMonth: null,
    _statsMonth: null,
    _noteType: 'absence',
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  }
  function fmtDate(s){
    if(!s) return '';
    const d = new Date(s + (s.length===10?'T00:00:00':''));
    return `${d.getMonth()+1}월 ${d.getDate()}일`;
  }
  function fmtShort(s){
    if(!s) return '';
    const d = new Date(s + (s.length===10?'T00:00:00':''));
    return `${d.getMonth()+1}/${d.getDate()}`;
  }
  function esc(str){
    return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function monthKey(dateStr){ const d = new Date(dateStr+'T00:00:00'); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`; }
  function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return `${y}년 ${m}월`; }
  function shiftMonth(ym, delta){
    let [y,m]=ym.split('-').map(Number); m+=delta;
    if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    return `${y}-${pad2(m)}`;
  }
  function toast(msg){
    const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
  }
  function showConfirm(message){
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(34,28,58,0.45); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px;';
      const box = document.createElement('div');
      box.style.cssText = 'background:#ffffff; border-radius:16px; padding:22px 20px; max-width:340px; width:100%; box-shadow:0 12px 30px rgba(0,0,0,0.25); font-family:"Noto Sans KR", sans-serif;';
      const msgEl = document.createElement('div');
      msgEl.style.cssText = 'font-size:14px; line-height:1.6; color:#221C3A; margin-bottom:18px; white-space:pre-wrap;';
      msgEl.textContent = message;
      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex; gap:8px;';
      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = '취소';
      cancelBtn.style.cssText = 'flex:1; border:1px solid #E7E1F3; background:#ffffff; color:#6E6690; border-radius:10px; padding:10px 12px; font-size:14px; font-weight:500; cursor:pointer; font-family:"Noto Sans KR", sans-serif;';
      const okBtn = document.createElement('button');
      okBtn.textContent = '확인';
      okBtn.style.cssText = 'flex:1; border:none; background:#4B3AA4; color:#ffffff; border-radius:10px; padding:10px 12px; font-size:14px; font-weight:500; cursor:pointer; font-family:"Noto Sans KR", sans-serif;';
      btnRow.appendChild(cancelBtn); btnRow.appendChild(okBtn);
      box.appendChild(msgEl); box.appendChild(btnRow);
      overlay.appendChild(box);
      const mountPoint = document.getElementById('gy-root') || document.body;
      mountPoint.appendChild(overlay);
      const cleanup = (result) => { mountPoint.removeChild(overlay); resolve(result); };
      cancelBtn.onclick = () => cleanup(false);
      okBtn.onclick = () => cleanup(true);
      overlay.onclick = (e) => { if(e.target === overlay) cleanup(false); };

  function withTimeout(promise, ms){

    ]);

  async function storageSetWithRetry(key, value, maxRetries){
    if(maxRetries === undefined) maxRetries = 5;
    let attempt = 0;
    while(true){
      try {
        await window.storage.set(key, value, true);
        return true;
      } catch(e){
        const msg = (e && e.message) ? e.message : String(e);
        const isRateLimit = /rate limit/i.test(msg);
        attempt++;
        if(!isRateLimit || attempt > maxRetries) throw e;
        await delay(700 * attempt);
      }
    }
  }
  async function storageGetWithRetry(key, maxRetries){
    if(maxRetries === undefined) maxRetries = 5;
    let attempt = 0;
    while(true){
      try {
        return await withTimeout(window.storage.get(key, true), 10000);
      } catch(e){
        const msg = (e && e.message) ? e.message : String(e);
        const isRateLimit = /rate limit/i.test(msg);
        attempt++;
        if(!isRateLimit || attempt > maxRetries) throw e;
        await delay(700 * attempt);
      }
    }
  }

  function parseBulkStudents(text){
    const lines = text.split('\n').map(l=>l.trim()).filter(l=>l);
    const students = [], errors = [];
    lines.forEach((line, i) => {
      const parts = line.split('\t');
      if(parts.length < 2){ errors.push(`줄 ${i+1}: 탭으로 구분된 형식이 아니에요 — "${line}"`); return; }
      const classStr = parts[0].trim();
      const nameRaw = parts[1].trim();
      const classMatch = classStr.match(/^(고[123])-?(\d+반)$/);
      if(!classMatch){ errors.push(`줄 ${i+1}: 학년/반 형식 오류 — "${classStr}" (예: 고1-2반)`); return; }
      const grade = classMatch[1];
      const cls = classMatch[2];
      const name = nameRaw.replace(/\([남여]\)$/, '').trim();
      if(!name){ errors.push(`줄 ${i+1}: 이름이 비어 있어요`); return; }
      students.push({ grade, cls, name });
    });
    return { students, errors };
  }

      confirmBtn.disabled = students.length === 0;

      let added = 0, skipped = 0;

    listEl.querySelectorAll('.kid-info').forEach(el=>{
      el.onclick = () => { state.attendKid = el.dataset.name; state._calMonth = monthKey(todayStr()); renderAttend(panel); };
    });

        const idx = kidObj.checkins.indexOf(thisSunday);

          if(willBeOn) kidObj.checkins.splice(kidObj.checkins.indexOf(thisSunday),1); else kidObj.checkins.push(thisSunday);
          this.classList.toggle('on', !willBeOn);
          this.textContent = !willBeOn ? '이번 주일 출석' : '출석 표시';
          const revertStats = sundayStats(new Set(kidObj.checkins), ym);

        await deleteKid(grade, cls, name);
        toast('삭제했어요.');
        renderClassDetail(panel);
      };
    });
  }

   async function renderStats(panel){
    let all;
    try {
      all = await loadAllKids();
    } catch(e){
      panel.innerHTML = `<div class="empty"><div class="big">⚠️</div>불러오지 못했어요.<br/><button class="btn btn-primary btn-sm" id="retry-stats" style="margin-top:10px;">다시 시도</button></div>`;

    const groups = groupByClass(all);

    const overallRate = counted.length ? Math.round((presentTotal/counted.length)*100) : 0;

    const last8 = getLastNSundays(8);
    const weekBars = last8.map(ds=>{
      const present = counted.filter(k=>k.checkins.includes(ds)).length;

    const rosterHtml = all.length ? groups.map(g => {

          <td style="padding:9px 12px; text-align:center; font-size:13px; font-weight:700; color:${isPresent?'var(--indigo)':'var(--rose)'};">${isPresent?'✅ 출석':'❌ 결석'}</td>
          <td style="padding:9px 12px; text-align:center; font-size:12.5px; color:var(--ink-soft);">${k.checkins.length}회</td>

      return `<div class="card" style="padding:0; overflow:hidden; margin-bottom:12px;">

          <span style="font-size:12.5px;color:var(--ink-soft);"><b style="color:${presentCount===g.kids.length?'var(--indigo)':'var(--ink)'}">${presentCount}</b> / ${g.kids.length}명 출석</span>
        </div>
        <table style="width:100%;border-collapse:collapse;">
          <thead><tr style="background:var(--paper);border-bottom:1px solid var(--line);">
            <th style="padding:6px 12px;text-align:left;font-size:11px;color:var(--ink-soft);font-weight:500;">이름</th>
            <th style="padding:6px 12px;text-align:center;font-size:11px;color:var(--ink-soft);font-weight:500;">이번 주일</th>
            <th style="padding:6px 12px;text-align:center;font-size:11px;color:var(--ink-soft);font-weight:500;">누적 출석</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }).join('') : `<div class="empty" style="padding:20px;"><div class="big">🧑‍🎓</div>등록된 학생이 없어요.</div>`;

    panel.innerHTML = `
      <div class="section-title serif">통계</div>
      <div class="section-desc">전체 출석 현황을 한눈에 확인해요.</div>

      <div class="stat-box">
        <div class="sb"><b>${presentTotal}/${counted.length}</b><span>이번 주일 전체 출석</span></div>
        <div class="sb"><b>${overallRate}%</b><span>이번 주일 출석률</span></div>
        <div class="sb"><b>${groups.filter(g=>g.kids.some(k=>k.checkins.includes(thisSunday))).length}개</b><span>이번 주 출결 제출 반</span></div>
      </div>

      <div class="card">
        <div class="section-title serif" style="font-size:15.5px;">최근 8주 전체 출석 추이</div>
        <div class="chart-bars">
          ${weekBars.map(w=>`
            <div class="bar-col">
              <span class="bar-pct">${w.pct}%</span>
              <div class="bar-fill" style="height:${Math.max(w.pct,3)}%"></div>
              <span class="bar-label">${fmtShort(w.date)}</span>
            </div>`).join('')}
        </div>
      </div>

      <div class="section-title serif" style="font-size:16px; margin-top:4px;">이번 주일 학생 출결</div>
      <div class="section-desc" style="margin-bottom:12px;">전체 학생의 이번 주 출석 현황이에요.</div>
      ${rosterHtml}
    `;
  }

window.generateYearlyAttendance=async function(){
  if(typeof XLSX==='undefined'){alert('엑셀 라이브러리 로딩 중... 잠시 후 다시 시도해주세요.');return;}
  let all;
  try{all=await loadAllKids();}catch(e){alert('데이터를 불러오지 못했어요.');return;}
  const year=new Date().getFullYear();
  const sundays=[];
  const d=new Date(year,0,1);
  while(d.getDay()!==0)d.setDate(d.getDate()+1);
  const today=new Date();today.setHours(0,0,0,0);
  while(d<=today){sundays.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);d.setDate(d.getDate()+7);}
  const classOrder=['고1-1반','고1-2반','고1-3반','고1-4반','고1-5반','고1-6반','고1-7반','고2-1반','고2-2반','고2-3반','고2-4반','고2-5반','고2-6반','고2-7반','고3-1반','고3-2반','고3-3반','고3-4반','고3-5반','고3-6반'];
  const headers=['학년','반','이름',...sundays.map(s=>{const dt=new Date(s+'T00:00:00');return `${dt.getMonth()+1}/${dt.getDate()}`;})];
  const rows=[headers];
  const sundayPresent=new Array(sundays.length).fill(0);
  const sundayTotal=new Array(sundays.length).fill(0);
  classOrder.forEach(cls=>{
    const [grade,clsName]=cls.split('-');
    const students=all.filter(k=>k.grade===grade&&k.cls===clsName);
    if(!students.length)return;
    const countInRate=clsName!=='1반';
    students.forEach(k=>{
      const checkinSet=new Set(k.checkins||[]);
      const row=[grade,clsName,k.name];
      sundays.forEach((s,i)=>{
        const val=checkinSet.has(s)?1:0;
        row.push(val);
        if(countInRate){sundayPresent[i]+=val;sundayTotal[i]+=1;}
      });
      rows.push(row);
    });
    rows.push(new Array(headers.length).fill(''));
  });
  const rateRow=['','','출석률',...sundays.map((_,i)=>sundayTotal[i]>0?Math.round(sundayPresent[i]/sundayTotal[i]*1000)/10+'%':'')];
  rows.push(rateRow);
  const ws=XLSX.utils.aoa_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'연간출석부');
  XLSX.writeFile(wb,`고등부_연간출석부_${year}.xlsx`);
};

      await withLoading(btn, async () => {
        const ok = await saveItem('qt', { id:uid(), verse, content, date:todayStr(), createdAt:Date.now(), author: state.teacherName, comments:[] });
        if(ok){ toast('QT 나눔을 올렸어요.'); renderQt(panel); }
      });
    };
    loadCollection('qt').then(list=>{
      const el = document.getElementById('qt-list');
      if(!el) return;
      if(list === null){
        el.innerHTML = `<div class="empty"><div class="big">⚠️</div>불러오지 못했어요.<br/><button class="btn btn-primary btn-sm" id="retry-qt" style="margin-top:10px;">다시 시도</button></div>`;
        const rb = document.getElementById('retry-qt'); if(rb) rb.onclick = () => renderQt(panel);
        return;
      }
      el.innerHTML = list.length ? list.map(q=>`
        <div class="feed-card qt" data-id="${q.id}">
          <button class="del-x" data-id="${q.id}">삭제</button>
          <div class="feed-top"><span class="feed-title">${esc(q.verse)}</span><span class="feed-date">${fmtDate(q.date)}</span></div>
          <div class="feed-body">${esc(q.content)}</div>
          <div class="feed-author">— ${esc(q.author||'')}</div>
          ${(q.comments||[]).map(c=>`<div class="comment"><b>${esc(c.name)}</b> · ${fmtDate(c.at)}<br/>${esc(c.text)}</div>`).join('')}
          <div class="comment-form">
            <input type="text" placeholder="나눔 소감을 남겨 보세요" class="qt-comment-input"/>
            <button class="btn btn-primary btn-sm qt-comment-save">남기기</button>
          </div>
        </div>`).join('') : `<div class="empty"><div class="big">📖</div>아직 올린 QT 나눔이 없어요.</div>`;
      el.querySelectorAll('.del-x').forEach(b=>{
        b.onclick = async () => { await deleteItem('qt', b.dataset.id); toast('삭제했어요.'); renderQt(panel); };
      });
      el.querySelectorAll('.feed-card.qt').forEach(card=>{
        const id = card.dataset.id;
        card.querySelector('.qt-comment-save').onclick = async function(){
          const btn = this;
          const input = card.querySelector('.qt-comment-input');
          const text = input.value.trim();
          if(!text){ toast('내용을 입력해 주세요.'); return; }
          await withLoading(btn, async () => {
            const q = list.find(x=>x.id===id);
            if(!q.comments) q.comments = [];
            q.comments.push({ name: state.teacherName, text, at: todayStr() });
            const ok = await saveItem('qt', q);
            if(ok){ toast('나눔을 남겼어요.'); renderQt(panel); }
          });
        };
      });
    });
  }

  function renderPrayer(panel){
    panel.innerHTML = `
      <div class="section-title serif">기도제목</div>
      <div class="section-desc">선생님들끼리 나누는 기도제목이에요.</div>
      <div class="subtab-row">
        <div class="subtab ${state.prayerView==='all'?'active':''}" id="sub-all">모두 함께</div>
        <div class="subtab ${state.prayerView==='mine'?'active':''}" id="sub-mine">나의 기도제목</div>
      </div>
      <div class="card">
        <div class="field"><label>제목</label><input id="p-title" placeholder="예: 이번 수련회를 위해"/></div>
        <div class="field"><label>내용</label><textarea id="p-content" placeholder="기도제목을 자유롭게 적어 주세요"></textarea></div>
        <div class="field"><label>공개 범위</label>
          <div class="radio-row">
            <div class="radio-opt on" id="vis-public">함께 나누기</div>
            <div class="radio-opt" id="vis-private">나만 보기</div>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="p-save">기도제목 나누기</button>
      </div>
      <div id="prayer-list"><div class="empty">불러오는 중...</div></div>
    `;
    document.getElementById('sub-all').onclick = () => { state.prayerView='all'; renderPrayer(panel); };
    document.getElementById('sub-mine').onclick = () => { state.prayerView='mine'; renderPrayer(panel); };

    let visibility = 'public';
    document.getElementById('vis-public').onclick = function(){ visibility='public'; this.classList.add('on'); document.getElementById('vis-private').classList.remove('on'); };
    document.getElementById('vis-private').onclick = function(){ visibility='private'; this.classList.add('on'); document.getElementById('vis-public').classList.remove('on'); };
    document.getElementById('p-save').onclick = async function(){
      const btn = this;
      const title = document.getElementById('p-title').value.trim();
      const content = document.getElementById('p-content').value.trim();
      if(!title || !content){ toast('제목과 내용을 입력해 주세요.'); return; }
      await withLoading(btn, async () => {
        const ok = await saveItem('prayer', { id:uid(), title, content, date:todayStr(), createdAt:Date.now(), author: state.teacherName, visibility, answered:false });
        if(ok){ toast('기도제목을 나눴어요.'); renderPrayer(panel); }
      });
    };

    loadCollection('prayer').then(list=>{
      const el = document.getElementById('prayer-list');
      if(!el) return;
      if(list === null){
        el.innerHTML = `<div class="empty"><div class="big">⚠️</div>불러오지 못했어요.<br/><button class="btn btn-primary btn-sm" id="retry-prayer" style="margin-top:10px;">다시 시도</button></div>`;
        const rb = document.getElementById('retry-prayer'); if(rb) rb.onclick = () => renderPrayer(panel);
        return;
      }
      const filtered = state.prayerView==='mine'
        ? list.filter(p=>p.author===state.teacherName)
        : list.filter(p=>p.visibility==='public' || p.author===state.teacherName);
      el.innerHTML = filtered.length ? filtered.map(p=>{
        const mine = p.author === state.teacherName;
        return `<div class="feed-card prayer" data-id="${p.id}">
          ${mine ? `<button class="del-x" data-id="${p.id}">삭제</button>` : ''}
          <div class="feed-top"><span class="feed-title">${esc(p.title)}</span><span class="feed-date">${fmtDate(p.date)}</span></div>
          <div class="feed-meta"><span class="badge ${p.visibility==='public'?'badge-public':'badge-private'}">${p.visibility==='public'?'함께 나누기':'나만 보기'}</span> ${p.answered?'<span class="badge badge-answered">🙏 응답됨</span>':''}</div>
          <div class="feed-body">${esc(p.content)}</div>
          <div class="feed-author">— ${esc(p.author||'')}</div>
          ${mine && !p.answered ? `<button class="btn btn-ghost btn-sm mark-answered" data-id="${p.id}" style="margin-top:10px;">🙏 응답받았어요</button>` : ''}
        </div>`;
      }).join('') : `<div class="empty"><div class="big">🙏</div>아직 나눈 기도제목이 없어요.</div>`;
      el.querySelectorAll('.del-x').forEach(b=>{
        b.onclick = async () => { await deleteItem('prayer', b.dataset.id); toast('삭제했어요.'); renderPrayer(panel); };
      });
      el.querySelectorAll('.mark-answered').forEach(b=>{
        b.onclick = async function(){
          const btn = this;
          await withLoading(btn, async () => {
            const p = list.find(x=>x.id===b.dataset.id);
            p.answered = true; p.answeredAt = todayStr();
            const ok = await saveItem('prayer', p);
            if(ok){ toast('응답 감사해요! 🙏'); renderPrayer(panel); }
          });
        };
      });
    });
  }

  function showSplash(callback){
    const el = document.createElement('div');
    el.style.cssText = [
      'position:fixed;inset:0;z-index:9999;',
      'background:linear-gradient(155deg,#2E2266 0%,#4B3AA4 40%,#8C4A7A 70%,#D4607A 100%);',
      'display:flex;flex-direction:column;align-items:center;justify-content:center;',
      'opacity:1;transition:opacity 0.65s ease;overflow:hidden;'
    ].join('');

    // 배경 글로우
    const glow1 = document.createElement('div');
    glow1.style.cssText = 'position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(212,96,122,0.38) 0%,transparent 68%);top:50%;left:50%;transform:translate(-50%,-60%);pointer-events:none;';
    const glow2 = document.createElement('div');
    glow2.style.cssText = 'position:absolute;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(243,182,90,0.18) 0%,transparent 65%);bottom:10%;right:10%;pointer-events:none;';

    // 첫째 줄
    const line1 = document.createElement('div');
    line1.textContent = '은혜의교회 고등부';
    line1.style.cssText = [
      'font-family:"Gowun Batang",serif;font-size:36px;font-weight:700;color:#fff;',
      'letter-spacing:1.5px;text-align:center;',
      'text-shadow:0 2px 24px rgba(212,96,122,0.55);',
      'opacity:0;transform:translateY(14px);',
      'transition:opacity 0.7s ease 0.25s,transform 0.7s ease 0.25s;'
    ].join('');

    // 둘째 줄
    const line2 = document.createElement('div');
    line2.textContent = 'We go high!';
    line2.style.cssText = [
      'font-family:"Gowun Batang",serif;font-size:22px;font-weight:400;',
      'color:rgba(255,255,255,0.78);letter-spacing:4px;text-align:center;',
      'margin-top:14px;',
      'opacity:0;transform:translateY(10px);',
      'transition:opacity 0.7s ease 0.5s,transform 0.7s ease 0.5s;'
    ].join('');

    el.appendChild(glow1);
    el.appendChild(glow2);
    el.appendChild(line1);
    el.appendChild(line2);
    document.body.appendChild(el);

    // 등장 애니메이션
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      line1.style.opacity='1'; line1.style.transform='translateY(0)';
      line2.style.opacity='1'; line2.style.transform='translateY(0)';
    }));

    // 2.4초 후 페이드아웃
    setTimeout(()=>{
      el.style.opacity='0';
      setTimeout(()=>{ el.remove(); callback(); }, 680);
    }, 2400);
  }

  showSplash(()=>render());
})();
</script>

</body>
</html>
